# Pages shown in navbar
nav_pages:
  - name: team
  - name: research
  - name: papers
  - name: teaching
  - name: prospective

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links


plugins: 
  - jekyll-scholar
  - jekyll-seo-tag

# Author names to bold in rendered paper citations (match the rendered form).
bold_names:
  - "Fridovich-Keil, S."
  - "Fridovich-Keil, Sara"
  - "Kim, N."
  - "Nguyen, Q. L. N."
  - "Burns, B. A."
  - "Kheirandish, A."
  - "Hong, J."

scholar:

  last_name: Fridovich-Keil
  first_name: Sara

  style: shb
  locale: en

  source: assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - tags
  - Rakefile
  - LICENSE
  - .DS_Store
  - jekcheck.sh
  - node_modules
  - package.json
  - package-lock.json
  - docs
