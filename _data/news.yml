- date: July 15th, 2026
  headline: "Sara will be giving a <a href='https://icerm.brown.edu/video_archive/4771' target='_blank' rel='noopener noreferrer'>two-part talk</a> in the <a href='https://icerm.brown.edu/program/topical_workshop/tw-26-m3d' target='_blank' rel='noopener noreferrer'>Mathematics of 3D Reconstruction workshop</a> at ICERM on both <a href='https://arxiv.org/abs/2606.00126' target='_blank' rel='noopener noreferrer'>rate-distortion for compressive signal parameterizations</a> and <a href='https://arxiv.org/abs/2605.30330' target='_blank' rel='noopener noreferrer'>a finite-sample lens on when, why, and how diffusion posterior samplers fail</a>."

- date: June 17th, 2026
  headline: "Our paper <a href='https://voilalab.github.io/3D-Field-of-Junctions/' target='_blank' rel='noopener noreferrer'>3D Field of Junctions: A Noise-Robust, Training-Free Structural Prior for Volumetric Inverse Problems</a>, joint with <a href='https://ece.gatech.edu/directory/justin-romberg' target='_blank' rel='noopener noreferrer'> Prof. Justin Romberg</a>, has been accepted to ECCV. Congrats Namhoon and Narges!"

- date: June 9th, 2026
  headline: "<a href='https://voilalab.github.io' target='_self' rel='noopener noreferrer'>New website</a> is up!"

- date: June 3rd, 2026
  headline: "Our group will be presenting two papers this week at CVPR: <a href='https://cvpr.thecvf.com/virtual/2026/poster/37660' target='_blank' rel='noopener noreferrer'>KLIP (main track)</a> and <a href='https://vision-workshop-26.github.io/cvpr-2026/' target='_blank' rel='noopener noreferrer'>3D Field of Junctions (workshop)</a>. Sara will also be giving talks in the <a href='https://alumni.media.mit.edu/~ayush/CCD/' target='_blank' rel='noopener noreferrer'>Computational Cameras and Displays</a> and <a href='https://ivl.cs.brown.edu/4dworldmodels/' target='_blank' rel='noopener noreferrer'>4D World Models</a> workshops on <a href='https://arxiv.org/abs/2605.30330' target='_blank' rel='noopener noreferrer'>a finite-sample lens on when, why, and how diffusion posterior samplers fail</a> and <a href='https://arxiv.org/abs/2606.00126' target='_blank' rel='noopener noreferrer'>rate-distortion for compressive signal parameterizations</a> respectively."

- date: May 28th, 2026
  headline: "New preprint on predicting the reconstruction error of compressive signal parameterizations without access to ground truth <a href='https://arxiv.org/abs/2606.00126' target='_blank' rel='noopener noreferrer'>is available on arXiv</a>."

- date: May 28th, 2026
  headline:  "New preprint on understanding when, why, and how diffusion posterior samplers fail <a href='https://arxiv.org/abs/2605.30330' target='_blank' rel='noopener noreferrer'>is available on arXiv</a>."
