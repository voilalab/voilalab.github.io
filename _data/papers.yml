# Per-paper metadata, keyed by bib citation key (entry.key). All fields optional.
# Keys must match ref.bib exactly. Used by the papers page (_layouts/bibtemplate.html)
# and the research page (_pages/research.md, via _plugins/research_papers.rb).
#
# Papers page:
#   code:     GitHub repo URL -> renders a CODE button
#   project:  Project-page URL -> renders a PROJECT button
#   equal:    N -> marks the first N authors as equal contribution (co-first) with *
#   badge: explicit override for the left-column pill label (e.g. "PREPRINT").
#          Normally unnecessary: arXiv entries get a PREPRINT badge automatically from
#          their archiveprefix field, and article/inproceedings/report get JOURNAL/
#          CONFERENCE/REPORT from their bib type.
#
# Research page:
#   themes:   research.yml theme slugs this paper belongs to. Tagged papers count
#             towards the theme's "all N papers" link and filter on the papers page.
#   featured: true -> always shown on its themes' cards (major work). Other tagged
#             papers are shown only while recent; see `selection` in research.yml.
#   short:    short name shown on the card (defaults to the bib title)
#   summary:  one sentence on what the paper shows, shown under the name
#   venue:    override for the short venue label (normally derived from ref.bib)
#
# Example:
# plenoxels:
#   code: https://github.com/sxyu/svox2
#   themes: [3d-reconstruction]
#   featured: true
#   short: Plenoxels
#   summary: Radiance fields on a sparse voxel grid train 100x faster than NeRF, no neural network needed.

