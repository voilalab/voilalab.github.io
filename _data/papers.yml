# Presentation-only metadata for the papers page, merged into _layouts/bibtemplate.html
# by bib citation key (entry.key). All fields optional. Keys must match ref.bib exactly.
#
#   code:     GitHub repo URL -> renders a CODE button
#   project:  Project-page URL -> renders a PROJECT button
#   badge: explicit override for the left-column pill label (e.g. "PREPRINT").
#          Normally unnecessary: arXiv entries get a PREPRINT badge automatically from
#          their archiveprefix field, and article/inproceedings/report get JOURNAL/
#          CONFERENCE/REPORT from their bib type.
#
# Example:
# plenoxels:
#   code: https://github.com/sxyu/svox2

